# Build the package and upload it to PyPI when a GitHub release is published.
# PyPI trusts this workflow (trusted publishing), so no token is stored anywhere.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sqd/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$module" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, pyproject.toml $version and __version__ $module must match."
            exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel and run sqd
        run: |
          pip install dist/*.whl
          sqd --help

      - uses: pypa/gh-action-pypi-publish@release/v1
